<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SHRUTI — Particle Letters</title>
<meta name="description" content="Interactive 3D particle letter system with hand tracking.">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/control_utils/control_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/drawing_utils/drawing_utils.js" crossorigin="anonymous"></script>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/hands/hands.js" crossorigin="anonymous"></script>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  background: #030308;
  overflow: hidden;
  font-family: 'Courier New', monospace;
  color: #00ffff;
}

#canvas-container {
  position: fixed;
  inset: 0;
  z-index: 1;
}

#three-canvas {
  display: block;
  width: 100% !important;
  height: 100% !important;
}

/* WEBCAM */
#webcam-wrap {
  position: fixed;
  top: 18px;
  right: 18px;
  width: 160px;
  height: 120px;
  z-index: 100;
  border-radius: 8px;
  overflow: hidden;
  border: 1px solid rgba(0,255,255,0.3);
  box-shadow: 0 0 24px rgba(0,255,255,0.15);
  background: #000;
  transition: opacity 0.5s ease;
}

#webcam-wrap.cam-hidden {
  opacity: 0;
  pointer-events: none;
}

#webcam-wrap::before {
  content: 'LIVE';
  position: absolute;
  bottom: 7px;
  right: 9px;
  font-size: 8px;
  letter-spacing: 2px;
  color: rgba(0,255,255,0.5);
  z-index: 10;
}

#webcam-wrap::after {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, transparent, rgba(0,255,255,0.8), transparent);
  animation: scan 2.5s linear infinite;
}

@keyframes scan {
  0%   { top: 0;    opacity: 1; }
  100% { top: 100%; opacity: 0; }
}

#webcam-video {
  width: 100%;
  height: 100%;
  object-fit: cover;
  transform: scaleX(-1);
}

/* CAMERA ERROR BADGE */
#cam-error {
  position: fixed;
  top: 18px;
  right: 18px;
  z-index: 110;
  background: rgba(255,40,40,0.13);
  border: 1px solid rgba(255,60,60,0.35);
  border-radius: 7px;
  padding: 9px 13px;
  font-size: 9px;
  letter-spacing: 2px;
  color: rgba(255,110,110,0.9);
  display: none;
  max-width: 180px;
  line-height: 1.7;
  backdrop-filter: blur(10px);
}

/* LETTER INDICATOR */
#letter-display {
  position: fixed;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  display: flex;
  align-items: flex-end;
  gap: 10px;
  padding-bottom: 28px;
  pointer-events: none;
}

.letter-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.12);
  transition: all 0.4s ease;
}

.letter-dot.active {
  background: #fff;
  box-shadow: 0 0 14px currentColor;
  transform: scale(1.3);
}

/* CURRENT LETTER */
#current-letter {
  position: fixed;
  bottom: 60px;
  left: 50%;
  transform: translateX(-50%);
  font-size: 88px;
  font-weight: 900;
  letter-spacing: -4px;
  pointer-events: none;
  z-index: 100;
  opacity: 0.08;
  transition: opacity 0.6s ease, color 0.6s ease;
  font-family: 'Courier New', monospace;
  user-select: none;
}

#current-letter.flash-in {
  animation: letterFlash 0.6s ease forwards;
}

@keyframes letterFlash {
  0%   { opacity: 0.25; transform: translateX(-50%) scale(1.08); }
  100% { opacity: 0.08; transform: translateX(-50%) scale(1); }
}

/* TOP STATUS */
#status-bar {
  position: fixed;
  top: 18px;
  left: 18px;
  z-index: 100;
  display: flex;
  flex-direction: column;
  gap: 5px;
}

.s-row {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 9px;
  letter-spacing: 2px;
  color: rgba(0,255,255,0.45);
}

.s-dot {
  width: 5px;
  height: 5px;
  border-radius: 50%;
  background: rgba(0,255,255,0.2);
  flex-shrink: 0;
  transition: background 0.3s, box-shadow 0.3s;
}

.s-dot.on {
  background: #00ffff;
  box-shadow: 0 0 6px #00ffff;
  animation: pulse 1.6s ease-in-out infinite;
}

.s-dot.pur { background: rgba(180,0,255,0.2); }

.s-dot.pur.on {
  background: #b400ff;
  box-shadow: 0 0 6px #b400ff;
  animation: pulse 1.6s ease-in-out infinite;
}

.s-dot.grn { background: rgba(0,255,100,0.2); }

.s-dot.grn.on {
  background: #00ff64;
  box-shadow: 0 0 6px #00ff64;
  animation: pulse 1.6s ease-in-out infinite;
}

@keyframes pulse {
  0%,100% { opacity: 1; transform: scale(1); }
  50%      { opacity: 0.4; transform: scale(0.6); }
}

/* GESTURE PANEL */
#gesture-panel {
  position: fixed;
  bottom: 30px;
  left: 22px;
  z-index: 100;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(0,255,255,0.15);
  border-radius: 7px;
  padding: 14px 18px;
  backdrop-filter: blur(12px);
  min-width: 200px;
}

#gesture-panel::before {
  content: '';
  position: absolute;
  top: 0; left: 0; right: 0;
  height: 1px;
  background: linear-gradient(90deg, #00ffff, rgba(180,0,255,0.7), transparent);
}

.gp-title {
  font-size: 8px;
  letter-spacing: 3px;
  color: rgba(0,255,255,0.35);
  margin-bottom: 10px;
}

.gp-letter {
  font-size: 26px;
  font-weight: bold;
  letter-spacing: 3px;
  margin-bottom: 12px;
  transition: color 0.5s, text-shadow 0.5s;
}

.gp-row {
  display: flex;
  align-items: center;
  gap: 9px;
  margin-bottom: 6px;
  font-size: 9px;
  letter-spacing: 1px;
  color: rgba(200,200,255,0.6);
}

.gp-key {
  font-size: 8px;
  border: 1px solid rgba(180,0,255,0.35);
  padding: 2px 7px;
  border-radius: 3px;
  color: #b400ff;
  min-width: 46px;
  text-align: center;
}

/* KEYBOARD HINT */
#kb-hint {
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  z-index: 100;
  background: rgba(0,0,0,0.55);
  border: 1px solid rgba(0,255,255,0.12);
  border-radius: 7px;
  padding: 10px 16px;
  backdrop-filter: blur(12px);
  font-size: 8px;
  letter-spacing: 2px;
  color: rgba(0,255,255,0.35);
  display: flex;
  gap: 16px;
  opacity: 0;
  transition: opacity 0.5s ease;
  pointer-events: none;
}

#kb-hint.visible { opacity: 1; }

.kb-key {
  border: 1px solid rgba(180,0,255,0.3);
  padding: 2px 7px;
  border-radius: 3px;
  color: rgba(180,0,255,0.8);
  font-size: 8px;
}

/* GESTURE FLASH */
#gflash {
  position: fixed;
  top: 46%;
  left: 50%;
  transform: translate(-50%, -50%);
  font-size: 13px;
  letter-spacing: 6px;
  color: #ff00aa;
  text-shadow: 0 0 18px #ff00aa;
  z-index: 100;
  pointer-events: none;
  opacity: 0;
  transition: opacity 0.25s ease;
}

#gflash.show { opacity: 1; }

/* HAND RING */
#hand-ring {
  position: fixed;
  width: 56px;
  height: 56px;
  border: 1.5px solid rgba(180,0,255,0.7);
  border-radius: 50%;
  pointer-events: none;
  z-index: 99;
  transform: translate(-50%, -50%);
  display: none;
  transition: border-color 0.2s, width 0.15s, height 0.15s, box-shadow 0.2s;
}

#hand-ring::after {
  content: '';
  position: absolute;
  inset: -6px;
  border-radius: 50%;
  border: 1px solid rgba(180,0,255,0.2);
}

#hand-ring.fist {
  border-color: #ffcc00;
  box-shadow: 0 0 14px rgba(255,204,0,0.4);
  width: 44px; height: 44px;
}

#hand-ring.open-hand {
  border-color: #00ff88;
  box-shadow: 0 0 18px rgba(0,255,136,0.4);
  width: 72px; height: 72px;
}

#hand-ring.pinching {
  border-color: #ff00aa;
  box-shadow: 0 0 14px rgba(255,0,170,0.4);
  width: 38px; height: 38px;
}

/* SWIPE CANVAS */
#swipe-canvas {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 98;
}

/* DEBUG */
#dbg {
  position: fixed;
  bottom: 30px;
  right: 18px;
  z-index: 100;
  background: rgba(0,0,0,0.7);
  border: 1px solid rgba(0,255,255,0.1);
  border-radius: 6px;
  padding: 10px 14px;
  font-size: 9px;
  letter-spacing: 1.5px;
  color: rgba(0,255,255,0.4);
  min-width: 158px;
  backdrop-filter: blur(8px);
}

.dr {
  display: flex;
  justify-content: space-between;
  gap: 14px;
  margin-bottom: 4px;
}

/* CORNERS */
.corner {
  position: fixed;
  width: 28px;
  height: 28px;
  z-index: 100;
  pointer-events: none;
}

.corner::before, .corner::after {
  content: '';
  position: absolute;
  background: rgba(0,255,255,0.3);
}

.c-tl { top: 8px; left: 8px; }
.c-tl::before { top:0;left:0;width:100%;height:1px; }
.c-tl::after  { top:0;left:0;width:1px;height:100%; }

.c-tr { top: 8px; right: 8px; }
.c-tr::before { top:0;right:0;width:100%;height:1px; }
.c-tr::after  { top:0;right:0;width:1px;height:100%; }

.c-bl { bottom: 8px; left: 8px; }
.c-bl::before { bottom:0;left:0;width:100%;height:1px; }
.c-bl::after  { bottom:0;left:0;width:1px;height:100%; }

.c-br { bottom: 8px; right: 8px; }
.c-br::before { bottom:0;right:0;width:100%;height:1px; }
.c-br::after  { bottom:0;right:0;width:1px;height:100%; }

/* LOADING */
#loading {
  position: fixed;
  inset: 0;
  z-index: 200;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  background: #030308;
  transition: opacity 0.9s ease;
}

#loading.gone {
  opacity: 0;
  pointer-events: none;
}

.ld-sub {
  font-size: 10px;
  letter-spacing: 7px;
  color: rgba(0,255,255,0.35);
  margin-bottom: 36px;
}

.ld-name {
  font-size: 52px;
  font-weight: 900;
  letter-spacing: 16px;
  margin-bottom: 6px;
  transition: color 0.5s, text-shadow 0.5s;
}

.ld-tag {
  font-size: 10px;
  letter-spacing: 4px;
  color: rgba(255,255,255,0.2);
  margin-bottom: 48px;
}

.ld-status {
  font-size: 10px;
  letter-spacing: 3px;
  color: rgba(0,255,255,0.5);
  margin-bottom: 36px;
  animation: blink 1.1s infinite;
}

@keyframes blink {
  0%,100% { opacity: 1; }
  50%      { opacity: 0.2; }
}

.ld-bar-wrap {
  width: 240px;
  height: 1px;
  background: rgba(0,255,255,0.12);
  position: relative;
}

.ld-bar {
  height: 100%;
  width: 0%;
  background: #00ffff;
  box-shadow: 0 0 8px #00ffff;
  transition: width 0.35s ease;
}

.ld-bar::after {
  content: '';
  position: absolute;
  right: 0; top: -2px;
  width: 4px; height: 4px;
  background: #fff; border-radius: 50%;
  box-shadow: 0 0 6px #00ffff;
}
</style>
</head>

<body>

<div id="canvas-container">
  <canvas id="three-canvas"></canvas>
</div>

<div id="webcam-wrap">
  <video id="webcam-video" autoplay muted playsinline></video>
</div>

<div id="cam-error">⚠ NO CAMERA<br>USE KEYBOARD</div>

<!-- Loading -->
<div id="loading">
  <div class="ld-sub">PARTICLE SYSTEM</div>
  <div class="ld-name" id="ld-name" style="color:#00ffff">SHRUTI</div>
  <div class="ld-tag">HAND TRACKING INTERFACE</div>
  <div class="ld-status" id="ld-status">INITIALIZING...</div>
  <div class="ld-bar-wrap">
    <div class="ld-bar" id="ld-bar"></div>
  </div>
</div>

<!-- Status -->
<div id="status-bar">
  <div class="s-row">
    <div class="s-dot on"></div>
    <span>PARTICLES ACTIVE</span>
  </div>
  <div class="s-row">
    <div class="s-dot pur" id="dot-hand"></div>
    <span id="hand-txt">AWAITING HAND</span>
  </div>
  <div class="s-row">
    <div class="s-dot grn" id="dot-cam"></div>

</div>

<!-- Gesture panel -->
<div id="gesture-panel">
  <div class="gp-title">CURRENT LETTER</div>
  <div class="gp-letter" id="gp-letter" style="color:#00ffff">S</div>
  <div class="gp-row"><div class="gp-key">SWIPE ←→</div><span>PREV / NEXT</span></div>
  <div class="gp-row"><div class="gp-key">FIST</div><span>NEXT LETTER</span></div>

</div>

<!-- Keyboard hint (shown when camera denied / on first keypress) -->

  <span><span class="kb-key">← →</span> LETTER</span>
  <span><span class="kb-key">SPACE</span> BURST</span>
  <span><span class="kb-key">1–6</span> JUMP</span>
  <span><span class="kb-key">+/−</span> ZOOM</span>
</div>

<!-- Big ghost letter -->
<div id="current-letter">S</div>

<!-- Letter navigation dots: S H R U T I -->
<div id="letter-display">
  <div class="letter-dot active" id="dot-0"></div>
  <div class="letter-dot" id="dot-1"></div>
  <div class="letter-dot" id="dot-2"></div>
  <div class="letter-dot" id="dot-3"></div>

</div>

<div id="gflash"></div>
<div id="hand-ring"></div>

<canvas id="swipe-canvas"></canvas>

<!-- Debug -->
<div id="dbg">
  <div style="color:rgba(0,255,255,0.25);letter-spacing:3px;font-size:8px;margin-bottom:8px">DEBUG</div>
  <div class="dr"><span>HAND</span><span id="dh" style="color:#555">NONE</span></div>
  <div class="dr"><span>GESTURE</span><span id="dge" style="color:#555">—</span></div>
  <div class="dr"><span>PINCH</span><span id="dp" style="color:#555">—</span></div>
  <div class="dr"><span>SWIPE</span><span id="ds" style="color:#555">—</span></div>
  <div class="dr"><span>FPS</span><span id="dfps" style="color:#555">—</span></div>
</div>

<div class="corner c-tl"></div>
<div class="corner c-tr"></div>
<div class="corner c-bl"></div>

<script>
'use strict';

// ============================================================
// SHRUTI — 3D PARTICLE LETTER SYSTEM  (UPGRADED v2)
// Fixes: ShaderMaterial for real per-particle size, keyboard +
// mouse fallback, burst gesture, camera error handling, swipe
// direction fix, hand ring gesture states, FPS counter.
// All original visuals fully preserved and enhanced.
// ============================================================

// ── DOM ──────────────────────────────────────────────────────
const loadingEl  = document.getElementById('loading');
const ldStatus   = document.getElementById('ld-status');
const ldBar      = document.getElementById('ld-bar');
const ldName     = document.getElementById('ld-name');
const dotHand    = document.getElementById('dot-hand');
const dotCam     = document.getElementById('dot-cam');
const handTxt    = document.getElementById('hand-txt');
const camTxt     = document.getElementById('cam-txt');
const gpLetter   = document.getElementById('gp-letter');
const bigLetter  = document.getElementById('current-letter');
const gflash     = document.getElementById('gflash');
const handRing   = document.getElementById('hand-ring');
const videoEl    = document.getElementById('webcam-video');
const webcamWrap = document.getElementById('webcam-wrap');
const camError   = document.getElementById('cam-error');
const kbHint     = document.getElementById('kb-hint');
const swipeCanvas= document.getElementById('swipe-canvas');
const swipeCtx   = swipeCanvas.getContext('2d');

const dh   = document.getElementById('dh');
const dge  = document.getElementById('dge');
const dp   = document.getElementById('dp');
const ds   = document.getElementById('ds');
const dfps = document.getElementById('dfps');

function resizeSC() {
  swipeCanvas.width  = innerWidth;
  swipeCanvas.height = innerHeight;
}
resizeSC();
window.addEventListener('resize', resizeSC);

// ── THREE.JS ─────────────────────────────────────────────────
const threeCanvas = document.getElementById('three-canvas');

const renderer = new THREE.WebGLRenderer({ canvas: threeCanvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.setSize(innerWidth, innerHeight);
renderer.setClearColor(0x030308, 1);

const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x030308, 0.035);

const camera = new THREE.PerspectiveCamera(70, innerWidth / innerHeight, 0.1, 1000);
camera.position.z = 10;

window.addEventListener('resize', () => {
  camera.aspect = innerWidth / innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth, innerHeight);
});

// ── LETTERS ───────────────────────────────────────────────────
const LETTERS = ['S','H','R','U','T','I'];

const LETTER_COLORS = {
  S: [[0,1,1],[0,0.7,1],[0.2,0.9,1]],
  H: [[0.3,0.6,1],[0.5,0.8,1],[0.2,0.4,1]],
  R: [[0.8,0,1],[0.6,0,1],[1,0,0.8]],
  U: [[1,0.2,0],[1,0.5,0],[1,0.8,0]],
  T: [[0,1,0.4],[0,0.8,0.5],[0.2,1,0.6]],
  I: [[1,0.2,0.7],[1,0.1,0.4],[0.8,0.2,1]]
};

const MAIN_COLORS = ['#00ffff','#4488ff','#b400ff','#ff6600','#00ff88','#ff1493'];
const TRAIL_RGBS  = ['0,255,255','68,136,255','180,0,255','255,120,0','0,255,140','255,20,147'];

// ── LETTER STROKE PATHS ───────────────────────────────────────
const LETTER_STROKES = {
  S: [[[-0.55,1.2],[0.0,1.2],[0.55,0.95],[0.55,0.45],[0.0,0.15],[-0.45,-0.15],[-0.55,-0.55],[-0.35,-1.0],[0.15,-1.2],[0.6,-1.2]]],
  H: [[[-0.6,1.2],[-0.6,-1.2]],[[0.6,1.2],[0.6,-1.2]],[[-0.6,0],[0.6,0]]],
  R: [[[-0.6,-1.2],[-0.6,1.2]],[[-0.6,1.2],[0.15,1.2],[0.55,0.95],[0.55,0.45],[0.15,0.15],[-0.6,0.15]],[[0.0,0.15],[0.65,-1.2]]],
  U: [[[-0.6,1.2],[-0.6,-0.65],[-0.4,-1.05],[0.0,-1.2],[0.4,-1.05],[0.6,-0.65],[0.6,1.2]]],
  T: [[[-0.7,1.2],[0.7,1.2]],[[0,1.2],[0,-1.2]]],
  I: [[[-0.45,1.2],[0.45,1.2]],[[0,1.2],[0,-1.2]],[[-0.45,-1.2],[0.45,-1.2]]]
};

// ── STROKE SAMPLER ────────────────────────────────────────────
function sampleStroke(pts, n) {
  if (n < 2) return [pts[0]];
  const segs = []; let totalLen = 0;
  for (let i = 0; i < pts.length-1; i++) {
    const dx = pts[i+1][0]-pts[i][0], dy = pts[i+1][1]-pts[i][1];
    const l = Math.sqrt(dx*dx+dy*dy); segs.push(l); totalLen += l;
  }
  const step = totalLen / (n-1);
  const result = [[pts[0][0], pts[0][1]]];
  let segIdx = 0, segWalked = 0;
  for (let p = 1; p < n-1; p++) {
    const target = p * step;
    while (segIdx < segs.length-1 && segWalked + segs[segIdx] < target)
      segWalked += segs[segIdx++];
    const t2 = (target - segWalked) / (segs[segIdx] || 1e-9);
    result.push([
      pts[segIdx][0] + t2*(pts[segIdx+1][0]-pts[segIdx][0]),
      pts[segIdx][1] + t2*(pts[segIdx+1][1]-pts[segIdx][1])
    ]);
  }
  result.push([pts[pts.length-1][0], pts[pts.length-1][1]]);
  return result;
}

// ── PARTICLE CONFIG ───────────────────────────────────────────
const PARTICLE_COUNT = 8000;   // UPGRADED from 7000
const LETTER_SCALE   = 3.2;
const DEPTH_SPREAD   = 0.5;

function buildLetterTargets(letter) {
  const strokes = LETTER_STROKES[letter];
  const palette = LETTER_COLORS[letter];
  const allPts  = [];
  const strokeLens = strokes.map(s => {
    let l = 0;
    for (let i = 0; i < s.length-1; i++) {
      const dx = s[i+1][0]-s[i][0], dy = s[i+1][1]-s[i][1];
      l += Math.sqrt(dx*dx+dy*dy);
    }
    return l;
  });
  const totalLen = strokeLens.reduce((a,b)=>a+b, 0);
  strokes.forEach((stroke, si) => {
    const count = Math.max(8, Math.round(PARTICLE_COUNT * strokeLens[si] / totalLen));
    sampleStroke(stroke, count).forEach(([x,y]) => allPts.push([x,y]));
  });
  const tArr = new Float32Array(PARTICLE_COUNT * 3);
  const cArr = new Float32Array(PARTICLE_COUNT * 3);
  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const p = allPts[i % allPts.length];
    const jx = (Math.random()-0.5)*0.07, jy = (Math.random()-0.5)*0.07;
    tArr[i*3]   = (p[0]+jx) * LETTER_SCALE;
    tArr[i*3+1] = (p[1]+jy) * LETTER_SCALE;
    tArr[i*3+2] = (Math.random()-0.5) * DEPTH_SPREAD;
    const pc = palette[i % palette.length];
    const b  = 0.55 + Math.random()*0.45;
    cArr[i*3]   = pc[0]*b; cArr[i*3+1] = pc[1]*b; cArr[i*3+2] = pc[2]*b;
  }
  return { tArr, cArr };
}

const LETTER_DATA = {};
LETTERS.forEach(l => { LETTER_DATA[l] = buildLetterTargets(l); });

// ── PARTICLE ARRAYS ───────────────────────────────────────────
const positions  = new Float32Array(PARTICLE_COUNT * 3);
const targets    = new Float32Array(PARTICLE_COUNT * 3);
const velocities = new Float32Array(PARTICLE_COUNT * 3);
const colors     = new Float32Array(PARTICLE_COUNT * 3);
const baseColors = new Float32Array(PARTICLE_COUNT * 3);

// Per-particle size — ONLY works via ShaderMaterial (THREE.PointsMaterial ignores it).
// This is the critical bug fix: the original code set this attribute but PointsMaterial
// silently ignores custom size attributes. We now use a custom vertex shader that reads it.
const sizes = new Float32Array(PARTICLE_COUNT);

for (let i = 0; i < PARTICLE_COUNT; i++) {
  const i3 = i*3;
  positions[i3]   = (Math.random()-0.5)*22;
  positions[i3+1] = (Math.random()-0.5)*22;
  positions[i3+2] = (Math.random()-0.5)*22;
  sizes[i] = Math.random()*1.2 + 0.4;
}

// ── PARTICLE TEXTURE ──────────────────────────────────────────
function makeTex() {
  const c = document.createElement('canvas'); c.width = c.height = 64;
  const ctx = c.getContext('2d');
  const g = ctx.createRadialGradient(32,32,0,32,32,32);
  g.addColorStop(0,    'rgba(255,255,255,1)');
  g.addColorStop(0.25, 'rgba(255,255,255,0.85)');
  g.addColorStop(1,    'rgba(255,255,255,0)');
  ctx.fillStyle = g;
  ctx.fillRect(0,0,64,64);
  return new THREE.CanvasTexture(c);
}
const particleTex = makeTex();

// ── SHADER MATERIAL ───────────────────────────────────────────
// FIX: THREE.PointsMaterial has a single global `size` property and ignores
// per-vertex `size` attributes. A ShaderMaterial lets us read the `size`
// attribute per-particle so the glow/speed effect actually works.
const vertexShader = `
  attribute float size;
  attribute vec3 color;
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    vColor = color;
    vec4 mvPosition = modelViewMatrix * vec4(position, 1.0);
    // Distance-attenuated per-particle point size (mirrors sizeAttenuation: true)
    gl_PointSize = max(1.0, size * (280.0 / -mvPosition.z));
    gl_Position  = projectionMatrix * mvPosition;
    vAlpha = clamp(1.0 - (-mvPosition.z) / 80.0, 0.0, 1.0);
  }
`;
const fragmentShader = `
  uniform sampler2D uTex;
  varying vec3 vColor;
  varying float vAlpha;
  void main() {
    vec4 t = texture2D(uTex, gl_PointCoord);
    gl_FragColor = vec4(vColor * t.rgb, t.a * vAlpha);
  }
`;

const mat = new THREE.ShaderMaterial({
  uniforms:      { uTex: { value: particleTex } },
  vertexShader,
  fragmentShader,
  transparent:   true,
  depthWrite:    false,
  blending:      THREE.AdditiveBlending
});

const geo = new THREE.BufferGeometry();
geo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
geo.setAttribute('color',    new THREE.BufferAttribute(colors, 3));
geo.setAttribute('size',     new THREE.BufferAttribute(sizes, 1));

const pts = new THREE.Points(geo, mat);
scene.add(pts);

// ── STATE ─────────────────────────────────────────────────────
let currentIdx      = 0;
let cameraTargetZ   = 10;
let cameraRotY      = 0;
const ORBIT_SPD     = 0.0004;

let handPresent     = false;
let handX3D = 0, handY3D = 0, handZ3D = 0;

let pinchActive     = false;
let pinchStartDist  = 1;
let pinchStartCamZ  = 10;

let lastFist        = false;
let fistCooldown    = 0;
let openHandStrength= 0;

let swipePrevX      = null, swipePrevY = null;
let swipeVelX       = 0,    swipeVelY  = 0;
let swipeCooldown   = 0;
let swipeTrail      = [];

const SWIPE_THRESH  = 0.020;
const SWIPE_COOL    = 38;
const SWIPE_MAX     = 20;

let frameTime       = 0;
let frameCount      = 0;
let lastFpsMs       = performance.now();
let fpsVal          = 0;
let autoLetterCool  = 0;
const AUTO_FRAMES   = 420;

const LERP  = 0.038;
const FRIC  = 0.91;
const REPELF= 0.32;
const REPR  = 2.8;

// Burst
let burstPending  = false;
let burstStrength = 0;

// Mouse / touch repulsion fallback
let mouseActive = false;
let mouseX3D = 0, mouseY3D = 0;

// ── LETTER SWITCHING ──────────────────────────────────────────
function setLetter(idx, label) {
  currentIdx = ((idx % LETTERS.length) + LETTERS.length) % LETTERS.length;
  const letter = LETTERS[currentIdx];
  const data   = LETTER_DATA[letter];

  targets.set(data.tArr);
  baseColors.set(data.cArr);
  colors.set(data.cArr);
  geo.attributes.color.needsUpdate = true;

  const mc = MAIN_COLORS[currentIdx];

  gpLetter.textContent    = letter;
  gpLetter.style.color    = mc;
  gpLetter.style.textShadow = `0 0 24px ${mc}55`;

  bigLetter.textContent   = letter;
  bigLetter.style.color   = mc;
  bigLetter.style.opacity = '0.08';
  // Flash animation on letter change
  bigLetter.classList.remove('flash-in');
  void bigLetter.offsetWidth;
  bigLetter.classList.add('flash-in');

  LETTERS.forEach((_, i) => {
    const d = document.getElementById('dot-'+i);
    d.classList.toggle('active', i === currentIdx);
    d.style.background = i === currentIdx ? mc : '';
    d.style.boxShadow  = i === currentIdx ? `0 0 10px ${mc}` : '';
  });

  if (label) showFlash(label + ' ' + letter);
  autoLetterCool = 0;
}

function nextLetter(label) { setLetter(currentIdx + 1, label); }
function prevLetter(label) { setLetter(currentIdx - 1, label); }

function showFlash(txt) {
  gflash.textContent = txt;
  gflash.classList.add('show');
  clearTimeout(gflash._t);
  gflash._t = setTimeout(() => gflash.classList.remove('show'), 900);
}

function triggerBurst(strength = 1.0) {
  burstPending  = true;
  burstStrength = strength;
}

// ── KEYBOARD CONTROLS (fallback + bonus) ──────────────────────
let kbHintTimer = null;
function showKbHint() {
  kbHint.classList.add('visible');
  clearTimeout(kbHintTimer);
  kbHintTimer = setTimeout(() => kbHint.classList.remove('visible'), 4000);
}

document.addEventListener('keydown', e => {
  switch (e.key) {
    case 'ArrowRight': case 'd': case 'D':
      nextLetter('→'); break;
    case 'ArrowLeft':  case 'a': case 'A':
      prevLetter('←'); break;
    case ' ':
      e.preventDefault();
      triggerBurst(1.2);
      showFlash('BURST');
      break;
    case '+': case '=':
      cameraTargetZ = Math.max(4, cameraTargetZ - 1.5); break;
    case '-': case '_':
      cameraTargetZ = Math.min(20, cameraTargetZ + 1.5); break;
    case '1':case '2':case '3':case '4':case '5':case '6':
      setLetter(parseInt(e.key)-1, 'KEY'); break;
    case 'r': case 'R':
      triggerBurst(0.7); break;
  }
});
document.addEventListener('keydown', showKbHint, { once: true });

// ── MOUSE / TOUCH ─────────────────────────────────────────────
document.addEventListener('mousemove', e => {
  mouseX3D = ((e.clientX / innerWidth)  - 0.5) * 12;
  mouseY3D = -((e.clientY / innerHeight) - 0.5) * 9;
});
document.addEventListener('mousedown', e => {
  if (e.button === 0) { mouseActive = true; triggerBurst(0.5); }
});
document.addEventListener('mouseup',  () => { mouseActive = false; });
document.addEventListener('dblclick', () => nextLetter('CLICK'));
document.addEventListener('touchstart', e => {
  const t = e.touches[0];
  mouseX3D = ((t.clientX/innerWidth) -0.5)*12;
  mouseY3D = -((t.clientY/innerHeight)-0.5)*9;
  mouseActive = true; triggerBurst(0.4);
}, { passive: true });
document.addEventListener('touchend', () => { mouseActive = false; });
document.addEventListener('touchmove', e => {
  const t = e.touches[0];
  mouseX3D = ((t.clientX/innerWidth) -0.5)*12;
  mouseY3D = -((t.clientY/innerHeight)-0.5)*9;
}, { passive: true });

// ── HAND RING HELPER ──────────────────────────────────────────
function setRingState(state) {
  handRing.classList.remove('fist','open-hand','pinching');
  if (state) handRing.classList.add(state);
}

// ── DEBUG ─────────────────────────────────────────────────────
function updateDebug(hand, gesture, pinch, swipeSpd) {
  dh.textContent  = hand ? 'YES' : 'NONE';
  dh.style.color  = hand ? '#00ffff' : '#555';
  dge.textContent = hand ? (gesture||'REST') : '—';
  dge.style.color = hand ? '#ffcc00' : '#555';
  dp.textContent  = hand ? pinch.toFixed(3) : '—';
  dp.style.color  = (hand && pinch < 0.07) ? '#ff00aa' : (hand ? '#aaa' : '#555');
  ds.textContent  = swipeSpd > 0.005 ? swipeSpd.toFixed(3) : '—';
  ds.style.color  = swipeSpd > SWIPE_THRESH ? '#ff00aa' : (swipeSpd > 0.005 ? '#aaa' : '#555');
  dfps.textContent = fpsVal.toFixed(0);
  dfps.style.color = fpsVal > 50 ? '#00ff88' : fpsVal > 30 ? '#ffcc00' : '#ff4444';
}

// ── SWIPE TRAIL (rendered in main loop — no recursive setTimeout) ──
function renderTrail() {
  swipeCtx.clearRect(0,0,swipeCanvas.width,swipeCanvas.height);
  if (swipeTrail.length === 0) return;
  const rgb = TRAIL_RGBS[currentIdx];
  for (let i = 0; i < swipeTrail.length; i++) {
    const d     = swipeTrail[i];
    const alpha = (i / swipeTrail.length) * 0.85;
    const r     = 3 + (i / swipeTrail.length) * 10;
    const g2    = swipeCtx.createRadialGradient(d.x,d.y,0,d.x,d.y,r*2.5);
    g2.addColorStop(0, `rgba(${rgb},${alpha})`);
    g2.addColorStop(1, `rgba(${rgb},0)`);
    swipeCtx.beginPath();
    swipeCtx.arc(d.x,d.y,r*2.5,0,Math.PI*2);
    swipeCtx.fillStyle = g2;
    swipeCtx.fill();
  }
}

// ── MEDIAPIPE HAND RESULTS ────────────────────────────────────
function onHandResults(results) {
  if (results.multiHandLandmarks && results.multiHandLandmarks.length > 0) {
    handPresent = true;
    dotHand.classList.add('on');
    handTxt.textContent = 'HAND DETECTED';

    const lm    = results.multiHandLandmarks[0];
    const wrist = lm[0];

    handX3D = -(wrist.x - 0.5) * 10;
    handY3D = -(wrist.y - 0.5) * 8;
    handZ3D = -wrist.z * 5;

    handRing.style.display = 'block';
    handRing.style.left    = ((1 - wrist.x) * innerWidth)  + 'px';
    handRing.style.top     = (wrist.y        * innerHeight) + 'px';

    const thumb  = lm[4], index  = lm[8];
    const middle = lm[12], ring  = lm[16], pinky = lm[20];
    const iMCP   = lm[5],  mMCP  = lm[9];
    const rMCP   = lm[13], pMCP  = lm[17];

    // ── PINCH ──────────────────────────────────────────────
    const pinchDist = Math.hypot(thumb.x-index.x, thumb.y-index.y);
    if (pinchDist < 0.07) {
      if (!pinchActive) {
        pinchActive    = true;
        pinchStartDist = pinchDist;
        pinchStartCamZ = cameraTargetZ;
      }
      cameraTargetZ = Math.max(4, Math.min(20,
        pinchStartCamZ - (pinchDist - pinchStartDist) * 80));
      setRingState('pinching');
    } else {
      if (pinchActive) pinchStartCamZ = cameraTargetZ;
      pinchActive = false;
    }

    // ── FIST ───────────────────────────────────────────────
    // In landmark space y increases downward, so fingertip.y > MCP.y
    // means the finger is curled down = fist.
    const fistCount =
      (index.y  > iMCP.y + 0.02 ? 1 : 0) +
      (middle.y > mMCP.y + 0.02 ? 1 : 0) +
      (ring.y   > rMCP.y + 0.02 ? 1 : 0) +
      (pinky.y  > pMCP.y + 0.02 ? 1 : 0);
    const isFist = fistCount >= 3;

    if (isFist && !lastFist && fistCooldown <= 0) {
      nextLetter('FIST');
      fistCooldown = 40;
    }
    lastFist = isFist;
    if (fistCooldown > 0) fistCooldown--;

    // ── OPEN HAND ──────────────────────────────────────────
    const openCount =
      (index.y  < iMCP.y - 0.03 ? 1 : 0) +
      (middle.y < mMCP.y - 0.03 ? 1 : 0) +
      (ring.y   < rMCP.y - 0.03 ? 1 : 0) +
      (pinky.y  < pMCP.y - 0.03 ? 1 : 0);
    const isOpen = openCount >= 3 && !isFist;
    openHandStrength = isOpen
      ? Math.min(1.0, openHandStrength + 0.12)
      : Math.max(0.0, openHandStrength - 0.06);

    // ── SWIPE ──────────────────────────────────────────────
    let currentSwipeSpd = 0;
    if (swipePrevX !== null) {
      const rawVX = wrist.x - swipePrevX;
      const rawVY = wrist.y - swipePrevY;
      swipeVelX = swipeVelX * 0.5 + rawVX * 0.5;
      swipeVelY = swipeVelY * 0.5 + rawVY * 0.5;
      currentSwipeSpd = Math.hypot(swipeVelX, swipeVelY);

      if (currentSwipeSpd > 0.007) {
        swipeTrail.push({ x: (1-wrist.x)*innerWidth, y: wrist.y*innerHeight });
        if (swipeTrail.length > SWIPE_MAX) swipeTrail.shift();
      }

      if (currentSwipeSpd > SWIPE_THRESH && swipeCooldown <= 0) {
        // FIX: In mirrored webcam space wrist.x increases = hand moves to
        // viewer's right = after mirror = screen LEFT.
        // So: swipeVelX > 0 → hand went screen-right in raw = LEFT visually → prevLetter
        if (Math.abs(swipeVelX) > Math.abs(swipeVelY)) {
          swipeVelX > 0 ? prevLetter('← SWIPE') : nextLetter('SWIPE →');
        } else {
          swipeVelY > 0 ? nextLetter('↓ SWIPE') : prevLetter('↑ SWIPE');
        }
        swipeCooldown = SWIPE_COOL;
      }
    }
    swipePrevX = wrist.x; swipePrevY = wrist.y;
    if (swipeCooldown > 0) swipeCooldown--;

    // ── RING STATE ─────────────────────────────────────────
    if (!pinchActive) {
      if (isFist)        setRingState('fist');
      else if (isOpen)   setRingState('open-hand');
      else               setRingState(null);
    }

    const gestureStr = isFist ? 'FIST' : isOpen ? `OPEN ${openHandStrength.toFixed(2)}` : pinchActive ? 'PINCH' : 'REST';
    updateDebug(true, gestureStr, pinchDist, currentSwipeSpd);

  } else {
    handPresent      = false;
    openHandStrength = Math.max(0, openHandStrength - 0.06);
    dotHand.classList.remove('on');
    handTxt.textContent    = 'AWAITING HAND';
    handRing.style.display = 'none';
    setRingState(null);
    swipePrevX = null; swipeVelX = 0; swipeVelY = 0;
    if (fistCooldown > 0) fistCooldown--;
    updateDebug(false, null, 0, 0);
  }
}

// ── MEDIAPIPE INIT ────────────────────────────────────────────
function initMP() {
  const hands = new Hands({
    locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/hands/${f}`
  });
  hands.setOptions({
    maxNumHands:            1,
    modelComplexity:        1,
    minDetectionConfidence: 0.7,
    minTrackingConfidence:  0.6
  });
  hands.onResults(onHandResults);

  // Request camera manually so we can handle denials gracefully
  navigator.mediaDevices.getUserMedia({ video: { width:640, height:480, facingMode:'user' } })
    .then(stream => {
      videoEl.srcObject = stream;
      dotCam.classList.add('on');
      camTxt.textContent = 'CAMERA ACTIVE';

      const cam = new Camera(videoEl, {
        onFrame: async () => {
          try { await hands.send({ image: videoEl }); } catch(e) {}
        },
        width: 640, height: 480
      });
      cam.start().catch(err => console.warn('MediaPipe Camera start error:', err));
    })
    .catch(err => {
      console.warn('Camera denied:', err);
      webcamWrap.classList.add('cam-hidden');
      camError.style.display = 'block';
      dotCam.classList.remove('on');
      camTxt.textContent = 'CAMERA DENIED';
      // Show keyboard hint permanently
      kbHint.classList.add('visible');
      clearTimeout(kbHintTimer);
    });
}

// ── ANIMATION LOOP ────────────────────────────────────────────
function animate() {
  requestAnimationFrame(animate);

  frameTime++;
  frameCount++;
  autoLetterCool++;

  // FPS
  const now = performance.now();
  if (now - lastFpsMs >= 1000) {
    fpsVal = frameCount / ((now - lastFpsMs) / 1000);
    frameCount = 0; lastFpsMs = now;
  }

  if (autoLetterCool > AUTO_FRAMES) nextLetter('AUTO');

  // Camera zoom
  camera.position.z += (cameraTargetZ - camera.position.z) * 0.05;

  // Camera orbit
  cameraRotY += ORBIT_SPD;
  camera.position.x = Math.sin(cameraRotY) * 0.6;
  camera.position.y = Math.cos(cameraRotY * 0.6) * 0.25;
  camera.lookAt(0, 0, 0);

  pts.rotation.y += 0.0008;

  const pos = geo.attributes.position.array;
  const col = geo.attributes.color.array;
  const sz  = geo.attributes.size.array;

  // ── BURST ────────────────────────────────────────────────
  if (burstPending) {
    burstPending = false;
    for (let i = 0; i < PARTICLE_COUNT; i++) {
      const i3 = i*3;
      const dx = pos[i3], dy = pos[i3+1], dz = pos[i3+2];
      const dist = Math.sqrt(dx*dx+dy*dy+dz*dz) + 0.001;
      const f    = burstStrength * (0.3 + Math.random()*0.7);
      velocities[i3]   += dx/dist*f + (Math.random()-0.5)*0.35;
      velocities[i3+1] += dy/dist*f + (Math.random()-0.5)*0.35;
      velocities[i3+2] += dz/dist*f + (Math.random()-0.5)*0.5;
    }
  }

  // Repulsion source: real hand > mouse fallback
  const useMouseRepel = mouseActive && !handPresent;
  const repelX   = handPresent ? handX3D : (useMouseRepel ? mouseX3D : 0);
  const repelY   = handPresent ? handY3D : (useMouseRepel ? mouseY3D : 0);
  const repelZ   = handPresent ? handZ3D : 0;
  const repelStr = handPresent ? openHandStrength : (useMouseRepel ? 0.45 : 0);

  const ang  = pts.rotation.y;
  const cosA = Math.cos(-ang), sinA = Math.sin(-ang);
  const rHxL = repelX * cosA + repelZ * sinA;
  const rHzL = -repelX * sinA + repelZ * cosA;

  for (let i = 0; i < PARTICLE_COUNT; i++) {
    const i3 = i*3;

    const fx = Math.sin(frameTime*0.009 + i*0.05) * 0.007;
    const fy = Math.cos(frameTime*0.011 + i*0.04) * 0.007;

    velocities[i3]   += (targets[i3]   + fx - pos[i3])   * LERP;
    velocities[i3+1] += (targets[i3+1] + fy - pos[i3+1]) * LERP;
    velocities[i3+2] += (targets[i3+2]      - pos[i3+2]) * LERP;

    // Repulsion
    if (repelStr > 0.05) {
      const dx   = pos[i3]   - rHxL;
      const dy   = pos[i3+1] - repelY;
      const dz   = pos[i3+2] - rHzL;
      const dist = Math.sqrt(dx*dx+dy*dy+dz*dz) + 0.001;
      if (dist < REPR) {
        const f = ((REPR-dist)/REPR) * REPELF * repelStr;
        velocities[i3]   += dx/dist * f;
        velocities[i3+1] += dy/dist * f;
        velocities[i3+2] += dz/dist * f;
      }
    }

    velocities[i3]   *= FRIC;
    velocities[i3+1] *= FRIC;
    velocities[i3+2] *= FRIC;

    pos[i3]   += velocities[i3];
    pos[i3+1] += velocities[i3+1];
    pos[i3+2] += velocities[i3+2];

    // ── GLOW: per-particle speed → size + color boost ────
    // This NOW ACTUALLY WORKS because we use ShaderMaterial.
    // In the original code PointsMaterial ignored the size attribute entirely.
    const spd = Math.sqrt(
      velocities[i3]  *velocities[i3]   +
      velocities[i3+1]*velocities[i3+1] +
      velocities[i3+2]*velocities[i3+2]
    );

    if (spd > 0.04) {
      const boost = Math.min(spd * 4, 1.0);
      col[i3]   = Math.min(1, baseColors[i3]   + boost * 0.6);
      col[i3+1] = Math.min(1, baseColors[i3+1] + boost * 0.6);
      col[i3+2] = Math.min(1, baseColors[i3+2] + boost * 0.6);
      sz[i]     = Math.min(3.5, 1.2 + boost * 3);
    } else {
      col[i3]   = baseColors[i3];
      col[i3+1] = baseColors[i3+1];
      col[i3+2] = baseColors[i3+2];
      sz[i]     = Math.max(0.3, sz[i] * 0.97);
    }
  }

  geo.attributes.position.needsUpdate = true;
  geo.attributes.color.needsUpdate    = true;
  geo.attributes.size.needsUpdate     = true;

  // Trail decay in main loop (no recursive setTimeout)
  if (swipeTrail.length > 0) {
    renderTrail();
    swipeTrail = swipeTrail.filter((_, i) => i > swipeTrail.length - SWIPE_MAX + 3);
    if (swipeTrail.length === 0) swipeCtx.clearRect(0,0,swipeCanvas.width,swipeCanvas.height);
  }

  renderer.render(scene, camera);
}

// ── LOADING SEQUENCE ──────────────────────────────────────────
const loadColors = ['#00ffff','#4488ff','#b400ff','#ff6600','#00ff88','#ff1493'];
const steps = [
  [10, 'BOOTING CORE...',        null],
  [25, 'BUILDING S...',          0],
  [40, 'BUILDING H...',          1],
  [55, 'BUILDING R...',          2],
  [70, 'BUILDING U...',          3],
  [82, 'BUILDING T...',          4],
  [92, 'BUILDING I...',          5],
  [96, 'STARTING MEDIAPIPE...',  null],
  [100,'READY',                  null]
];

let si = 0;
function advLoad() {
  if (si >= steps.length) return;
  const [p, m, colorIdx] = steps[si++];
  ldBar.style.width    = p + '%';
  ldStatus.textContent = m;
  if (colorIdx !== null) {
    ldName.style.color      = loadColors[colorIdx];
    ldName.style.textShadow = `0 0 40px ${loadColors[colorIdx]}55`;
  }
  if (si < steps.length) setTimeout(advLoad, 350 + Math.random()*250);
}

// ── STARTUP ───────────────────────────────────────────────────
setLetter(0, null);
animate();
advLoad();

setTimeout(() => {
  initMP();
  setTimeout(() => {
    ldBar.style.width    = '100%';
    ldStatus.textContent = 'READY';
    setTimeout(() => {
      loadingEl.classList.add('gone');
      setTimeout(() => { loadingEl.style.display = 'none'; }, 950);
    }, 500);
  }, 1400);
}, 1000);

// Brief keyboard hint on load
setTimeout(() => {
  showKbHint();
}, 3000);
</script>
</body>
</html>
